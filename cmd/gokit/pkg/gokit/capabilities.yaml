version: "1.0.0"
updated_at: "2026-03-05"

capabilities:
  - name: kit
    description: 日志和基础工具
    import: github.com/tsopia/go-kit/kit
    scenarios:
      - name: 打印日志
        snippet: kit.Info(ctx, "message", "key", value)
      - name: 调试日志
        snippet: kit.Debug(ctx, "debug info")
    dependencies: []

  - name: database
    description: 数据库连接管理（GORM 封装）
    import: github.com/tsopia/go-kit/database
    scenarios:
      - name: 初始化数据库
        snippet: |
          db, err := database.New(cfg)
          if err != nil {
              return fmt.Errorf("init db: %w", err)
          }
      - name: 获取连接
        snippet: db := database.GetClient()
    dependencies: [kit]

  - name: cfg
    description: 配置管理
    import: github.com/tsopia/go-kit/cfg
    scenarios:
      - name: 加载配置
        snippet: err := cfg.Load("config.yaml", &config)
    dependencies: []

  - name: httpclient
    description: HTTP 客户端
    import: github.com/tsopia/go-kit/httpclient
    scenarios:
      - name: 发送 GET 请求
        snippet: resp, err := httpclient.Get(ctx, url)
    dependencies: [kit]

  - name: httpserver
    description: HTTP 服务器
    import: github.com/tsopia/go-kit/httpserver
    scenarios:
      - name: 创建服务器
        snippet: srv := httpserver.New(cfg)
    dependencies: [kit]

  - name: errors
    description: 错误处理
    import: github.com/tsopia/go-kit/errors
    scenarios:
      - name: 创建错误
        snippet: err := errors.New(errors.CodeInvalidParam, "参数错误")
    dependencies: []

  - name: llm
    description: 大模型客户端
    import: github.com/tsopia/go-kit/llm
    scenarios:
      - name: 创建 LLM 客户端
        snippet: client, err := llm.New(cfg)
    dependencies: [kit]
