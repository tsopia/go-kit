version: "1.1.0"
updated_at: "2026-03-28"

capabilities:
  - name: kit
    description: 日志和基础工具（Zap 封装，支持结构化日志和追踪）
    import: github.com/tsopia/go-kit/kit
    scenarios:
      - name: 打印信息日志
        snippet: kit.Info(ctx, "message", "key", value)
      - name: 打印调试日志
        snippet: kit.Debug(ctx, "debug info")
      - name: 打印错误日志
        snippet: kit.Error(ctx, "error occurred", "error", err)
      - name: 创建带追踪的上下文
        snippet: ctx = kit.WithTrace(ctx, "operation-name")
      - name: 获取追踪 ID
        snippet: traceID := kit.TraceID(ctx)
    dependencies: []

  - name: database
    description: 数据库连接管理（GORM 封装，支持 MySQL/PostgreSQL/SQLite）
    import: github.com/tsopia/go-kit/database
    scenarios:
      - name: 初始化数据库连接
        snippet: |
          db, err := database.New(cfg)
          if err != nil {
              return fmt.Errorf("init db: %w", err)
          }
      - name: 配置默认数据库客户端
        snippet: |
          _, err := database.Configure(cfg)
          if err != nil {
              return fmt.Errorf("configure db: %w", err)
          }
      - name: 获取默认数据库客户端
        snippet: db := database.GetClient()
      - name: 健康检查
        snippet: |
          if err := database.Ping(); err != nil {
              return fmt.Errorf("db unhealthy: %w", err)
          }
    dependencies: [kit]

  - name: cfg
    description: 配置管理（Viper 封装，支持 YAML/JSON/环境变量）
    import: github.com/tsopia/go-kit/cfg
    scenarios:
      - name: 加载配置文件
        snippet: |
          var config AppConfig
          if err := cfg.Load("config.yaml", &config); err != nil {
              return fmt.Errorf("load config: %w", err)
          }
      - name: 从环境变量加载
        snippet: |
          cfg.SetEnvPrefix("MYAPP")
          err := cfg.Load("", &config)
      - name: 获取配置值
        snippet: port := cfg.GetInt("server.port")
    dependencies: []

  - name: httpclient
    description: HTTP 客户端（Context-first，支持重试、熔断、调试）
    import: github.com/tsopia/go-kit/httpclient
    scenarios:
      - name: 发送 GET 请求
        snippet: |
          resp, err := httpclient.Get(ctx, "https://api.example.com/data")
          if err != nil {
              return fmt.Errorf("fetch data: %w", err)
          }
      - name: 发送 POST 请求
        snippet: |
          resp, err := httpclient.PostJSON(ctx, url, requestBody)
      - name: 创建带配置的客户端
        snippet: |
          client := httpclient.NewClient(
              httpclient.WithTimeout(30 * time.Second),
              httpclient.WithRetry(&httpclient.RetryConfig{MaxRetries: 3}),
          )
    dependencies: [kit]

  - name: httpserver
    description: HTTP 服务器（Gin 封装，支持 typed handler、模块注册与健康检查）
    import: github.com/tsopia/go-kit/httpserver
    scenarios:
      - name: 创建服务器
        snippet: |
          srv := httpserver.NewServer(&httpserver.Config{
              Port: 8080,
          })
      - name: 注册 Gin 路由
        snippet: |
          srv.GET("/health", func(c *gin.Context) {
              c.JSON(200, gin.H{"status": "ok"})
          })
      - name: 注册 typed handler
        snippet: |
          srv.POST("/login", httpserver.HandleJSON(login))
      - name: 注册 Query/URI typed handler
        snippet: |
          srv.GET("/users", httpserver.HandleQuery(listUsers))
          srv.GET("/users/:id", httpserver.HandleURI(getUser))
      - name: 启动服务器
        snippet: |
          if err := srv.Start(); err != nil {
              log.Fatal(err)
          }
    dependencies: []

  - name: middleware
    description: HTTP 中间件集合（Recovery、Timeout、TraceID、RequestID、AccessLog、Compression、ConcurrencyLimit、CORS、安全头等）
    import: github.com/tsopia/go-kit/httpserver/middleware
    scenarios:
      - name: 挂载恢复中间件
        snippet: |
          srv.Use(middleware.Recovery())
      - name: 挂载超时中间件
        snippet: |
          srv.Use(middleware.Timeout(2 * time.Second))
      - name: 挂载安全响应头
        snippet: |
          srv.Use(middleware.SecurityHeaders())
      - name: 挂载访问日志
        snippet: |
          srv.Use(middleware.AccessLog())
      - name: 挂载响应压缩
        snippet: |
          srv.Use(middleware.Compression())
      - name: 挂载并发保护
        snippet: |
          srv.Use(middleware.ConcurrencyLimit(100))
    dependencies: [httpserver]

  - name: httpserver-prometheus
    description: Prometheus 指标中间件与 /metrics 路由注册
    import: github.com/tsopia/go-kit/httpserver/observability/prometheus
    scenarios:
      - name: 挂载指标中间件
        snippet: |
          srv.Use(prometheusmiddleware.Middleware())
      - name: 显式注册 metrics 路由
        snippet: |
          prometheusmiddleware.Register(public, prometheusmiddleware.Config{
              Path: "/metrics",
          })
    dependencies: [httpserver, middleware]

  - name: httpserver-otel
    description: OpenTelemetry HTTP tracing 中间件
    import: github.com/tsopia/go-kit/httpserver/observability/otel
    scenarios:
      - name: 挂载 tracing 中间件
        snippet: |
          srv.Use(httpotel.Middleware(httpotel.Config{
              TracerName: "my-service",
          }))
    dependencies: [httpserver, middleware]

  - name: preset
    description: 官方推荐的 HTTP server 默认装配
    import: github.com/tsopia/go-kit/httpserver/preset
    scenarios:
      - name: 创建生产默认服务器
        snippet: |
          srv := preset.NewProductionServer(cfg)
    dependencies: [httpserver, middleware]

  - name: errorsx
    description: 将 errors 包的业务错误映射为 httpserver 的统一 HTTP 响应
    import: github.com/tsopia/go-kit/httpserver/integration/errorsx
    scenarios:
      - name: 挂载 errors 到 typed handler 的映射
        snippet: |
          srv.POST("/users", httpserver.HandleJSON(
              createUser,
              httpserver.WithErrorMapper(errorsx.Mapper()),
          ))
      - name: 单独获取 HTTP 状态和响应体
        snippet: |
          status, body := errorsx.Response(err)
    dependencies: [httpserver, errors]

  - name: swagger
    description: Swagger UI 路由挂载与文档接入（配合 httpserver 使用）
    import: github.com/tsopia/go-kit/httpserver/swagger
    scenarios:
      - name: 挂载 Swagger UI
        snippet: |
          httpswagger.Register(public, httpswagger.Config{
              Path: "/swagger/*any",
          })
      - name: 公开 Swagger 并保护业务路由
        snippet: |
          public := srv.Group("")
          protected := srv.Group("/api/v1")
          protected.Use(AuthMiddleware())
          httpswagger.Register(public, httpswagger.Config{})
    dependencies: [httpserver]

  - name: errors
    description: 错误处理（统一错误码、错误包装）
    import: github.com/tsopia/go-kit/errors
    scenarios:
      - name: 创建错误
        snippet: err := errors.New(errors.CodeInvalidParam, "参数错误")
      - name: 包装错误
        snippet: err := errors.Wrap(err, errors.CodeInternal, "数据库查询失败")
      - name: 判断错误码
        snippet: |
          if errors.IsCode(err, errors.CodeNotFound) {
              // 处理 404
          }
    dependencies: []

  - name: llm
    description: 大模型客户端统一封装（Eino 兼容）
    import: github.com/tsopia/go-kit/llm
    scenarios:
      - name: 创建 LLM 客户端
        snippet: |
          client, err := llm.New(llm.Config{
              Provider: llm.ProviderOpenAI,
              APIKey:   os.Getenv("OPENAI_API_KEY"),
          })
      - name: 发送聊天请求
        snippet: |
          resp, err := client.Chat(ctx, llm.ChatRequest{
              Messages: []llm.Message{
                  {Role: llm.RoleUser, Content: "Hello"},
              },
          })
      - name: 流式响应
        snippet: |
          stream, err := client.ChatStream(ctx, request)
          for chunk := range stream {
              fmt.Print(chunk.Content)
          }
    dependencies: [kit]

  - name: pgmq
    description: PostgreSQL 消息队列（基于 pgmq 扩展，支持延迟消息、死信队列、批量操作）
    import: github.com/tsopia/go-kit/pgmq
    scenarios:
      - name: 创建队列
        snippet: |
          queue, err := pgmq.NewQueue[MyMessage](ctx, db, "my_queue")
          if err != nil {
              return fmt.Errorf("init queue: %w", err)
          }
      - name: 发送消息
        snippet: |
          msgID, err := queue.Send(ctx, MyMessage{Data: "hello"})
      - name: 发送延迟消息
        snippet: |
          msgID, err := queue.SendWithDelay(ctx, msg, 5*time.Minute)
      - name: 批量发送消息
        snippet: |
          ids, err := queue.SendBatch(ctx, []MyMessage{msg1, msg2, msg3})
      - name: 读取消息
        snippet: |
          msgs, err := queue.Read(ctx, pgmq.ReadOptions{
              Quantity:          10,
              VisibilityTimeout: 30 * time.Second,
          })
      - name: 读取并删除消息
        snippet: |
          msg, err := queue.Pop(ctx)
      - name: 启动消费者
        snippet: |
          consumer, err := queue.StartConsumer(ctx, func(ctx context.Context, msg *pgmq.Message[MyMessage]) error {
              // 处理消息，返回 nil 表示成功，会自动归档
              return processMessage(msg.Body)
          })
      - name: 阻塞消费消息
        snippet: |
          err := queue.Consume(ctx, handler)
      - name: 归档消息
        snippet: |
          err := queue.Archive(ctx, msgID)
      - name: 删除消息
        snippet: |
          err := queue.Delete(ctx, msgID)
      - name: 使用 SDK 风格发送消息
        snippet: |
          msgID, err := pgmq.SendMsg[MyMessage](ctx, "my_queue", payload)
      - name: 配置全局客户端后使用
        snippet: |
          client, err := pgmq.Configure(db)
          msgID, err := pgmq.SendMsg[MyMessage](ctx, "my_queue", payload)
    dependencies: []

  - name: utils
    description: 通用工具函数（字符串/数字/时间/文件/加密/验证/JSON/反射/切片/Map）
    import: github.com/tsopia/go-kit/utils
    scenarios:
      - name: 字符串工具
        snippet: |
          utils.IsEmpty(str)
          utils.CamelToSnake(str)
          utils.MaskString(str, 0, 3, '*')
      - name: 加密工具
        snippet: |
          utils.MD5Hash(data)
          utils.SHA256Hash(data)
          utils.GenerateSecureToken(32)
      - name: 验证工具
        snippet: |
          utils.IsValidEmail(email)
          utils.IsStrongPassword(pwd)
      - name: 切片工具
        snippet: |
          utils.ContainsString(slice, item)
          utils.UniqueStrings(slice)
    dependencies: []

  - name: crypto
    description: 加解密与 JWT（AES-256-GCM、RSA-OAEP/PSS、JWT HS256/RS256）
    import: github.com/tsopia/go-kit/crypto
    scenarios:
      - name: 配置全局客户端
        snippet: |
          crypto.Configure(&crypto.Config{
              AESKey: "32-byte-key-for-aes-256-gcm!",
              JWTSecret: "my-secret",
          })
      - name: AES 加密解密
        snippet: |
          encrypted, err := crypto.EncryptAES([]byte("secret"))
          decrypted, err := crypto.DecryptAES(encrypted)
      - name: AES 字符串加密
        snippet: |
          encrypted, err := crypto.EncryptAESString("plaintext")
          decrypted, err := crypto.DecryptAESString(encrypted)
      - name: RSA 加密解密
        snippet: |
          encrypted, err := crypto.EncryptRSA([]byte("data"))
          decrypted, err := crypto.DecryptRSA(encrypted)
      - name: RSA 签名验证
        snippet: |
          signature, err := crypto.SignRSA(data)
          err := crypto.VerifyRSA(data, signature)
      - name: JWT 签名验证
        snippet: |
          token, err := crypto.SignJWT(crypto.JWTClaims{
              RegisteredClaims: jwt.RegisteredClaims{Subject: "user123"},
          })
          claims, err := crypto.ParseJWT(token)
    dependencies: []

  - name: storage
    description: 对象存储统一封装（OSS/COS/S3，支持安全直传授权）
    import: github.com/tsopia/go-kit/storage
    scenarios:
      - name: 初始化存储客户端
        snippet: |
          storage.Configure(&storage.Config{
              Type: storage.TypeOSS,
              Bucket: "my-bucket",
              Region: "cn-hangzhou",
              AccessKeyID: "...",
              AccessKeySecret: "...",
          })
      - name: 上传文件
        snippet: storage.Upload(ctx, "file.txt", reader)
      - name: 生成临时访问链接
        snippet: storage.SignedURL(ctx, "file.txt", 30*time.Minute)
      - name: 申请客户端直传授权
        snippet: |
          auth, err := storage.AuthorizeDirectUpload(ctx, storage.DirectUploadRequest{
              ObjectKey:   objectKey,
              ContentType: "image/png",
              Checksum: &storage.DirectUploadChecksum{
                  Algorithm: storage.DirectUploadChecksumMD5,
                  Value:     checksum,
              },
          })
      - name: 分片上传大文件
        snippet: |
          upload, _ := storage.InitMultipart(ctx, "large.zip")
          part, _ := storage.UploadPart(ctx, upload.UploadID, 1, reader)
          storage.CompleteMultipart(ctx, upload.UploadID, []*storage.PartInfo{part})
    dependencies: [kit]
